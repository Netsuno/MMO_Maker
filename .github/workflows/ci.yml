name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Frog.Creator.sln

      - name: Build (Release)
        run: dotnet build Frog.Creator.sln -c Release --no-restore

      - name: Test unitaires (Release)
        run: dotnet test Frog.Tests/Frog.Tests.csproj -c Release --no-build --verbosity normal

      - name: Smoke UI éditeur Windows (mémoire)
        env:
          FROG_EDITOR_FORCE_IN_MEMORY: "1"
        run: dotnet test tests/Frog.Editor.WindowsSmokeTests/Frog.Editor.WindowsSmokeTests.csproj -c Release --no-build --verbosity normal

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frog_test
          POSTGRES_PASSWORD: frog_test_local_only
          POSTGRES_DB: frog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frog_test -d frog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Frog.Creator.sln

      - name: Build (Release)
        run: dotnet build Frog.Creator.sln -c Release --no-restore

      - name: Integration tests (PostgreSQL)
        env:
          FROG_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=frog_test;Username=frog_test;Password=frog_test_local_only
        run: dotnet test tests/Frog.Persistence.IntegrationTests/Frog.Persistence.IntegrationTests.csproj -c Release --no-build --verbosity normal
