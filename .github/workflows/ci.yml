name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Frog.Creator.sln

      - name: Build (Release)
        run: dotnet build Frog.Creator.sln -c Release --no-restore

      - name: Test unitaires (Release)
        run: dotnet test Frog.Tests/Frog.Tests.csproj -c Release --no-build --verbosity normal

      - name: Smoke UI éditeur Windows (mémoire) ×3
        env:
          FROG_EDITOR_FORCE_IN_MEMORY: "1"
        shell: pwsh
        run: |
          $project = "tests/Frog.Editor.WindowsSmokeTests/Frog.Editor.WindowsSmokeTests.csproj"
          # Exclude gameplay-client smokes — those run in the dedicated step below (35 editor tests).
          $filter = "FullyQualifiedName!~GameplayClientSmoke"
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== Windows editor smoke pass $i/3 ==="
            $ok = $false
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              Write-Host "=== attempt $attempt/2 ==="
              dotnet test $project -c Release --no-build --verbosity normal --filter $filter
              if ($LASTEXITCODE -eq 0) {
                $ok = $true
                break
              }
              Write-Warning "Windows editor smoke pass $i/3 attempt $attempt failed with exit code $LASTEXITCODE"
            }
            if (-not $ok) {
              Write-Error "Windows editor smoke pass $i/3 failed after 2 attempts"
              exit 1
            }
          }
          Write-Host "=== Windows editor smoke 3/3 consecutive passes OK ==="

      - name: Gameplay client smoke (in-memory server) ×3
        shell: pwsh
        run: |
          $project = "tests/Frog.Editor.WindowsSmokeTests/Frog.Editor.WindowsSmokeTests.csproj"
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== Gameplay client smoke pass $i/3 ==="
            dotnet test $project -c Release --no-build --filter "FullyQualifiedName~GameplayClientSmoke"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Gameplay client smoke pass $i/3 failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }
          Write-Host "=== Gameplay client smoke 3/3 consecutive passes OK ==="

      - name: Upload Phase 6 editor UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-06-game-data-screenshots
          path: docs/progress/phase-06-essential-content-editors/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Phase 7 gameplay client screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-07-gameplay-client-screenshots
          path: artifacts/phase-07-gameplay-client/
          if-no-files-found: warn
          retention-days: 30

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frog_test
          POSTGRES_PASSWORD: frog_test_local_only
          POSTGRES_DB: frog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frog_test -d frog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Frog.Creator.sln

      - name: Build (Release)
        run: dotnet build Frog.Creator.sln -c Release --no-restore

      - name: Integration tests (PostgreSQL)
        env:
          FROG_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=frog_test;Username=frog_test;Password=frog_test_local_only
        run: dotnet test tests/Frog.Persistence.IntegrationTests/Frog.Persistence.IntegrationTests.csproj -c Release --no-build --verbosity normal
